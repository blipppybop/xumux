[package]
name = "xumux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lean local terminal multiplexer: spawn, drive and monitor programs in PTYs over a Unix socket"
license = "MIT"
repository = "https://github.com/blipppybop/xumux"
keywords = ["pty", "terminal", "multiplexer", "tmux", "automation"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
